[workspace]
members = [
    "crates/picocodex",
    "crates/picocodex-agent",
    "crates/picocodex-oai-api",
    "crates/picocodex-tools",
    "crates/picocodex-tools/macros",
    "js/bindings",
]
default-members = ["crates/picocodex"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Picocodex Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/seams-tech/picocodex"
repository = "https://github.com/seams-tech/picocodex"
readme = "README.md"
keywords = ["ai", "agents", "openai", "sdk", "websocket"]
categories = ["api-bindings", "asynchronous", "development-tools"]
publish = true

[workspace.dependencies]
base64 = "0.22.1"
async-trait = "=0.1.89"
bm25 = { version = "2.3.2", default-features = false }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std", "wasmbind"] }
criterion = { version = "0.7.0", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
eyre = "0.6.12"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "sink", "std"] }
getrandom = "0.4.3"
http = "1.3.1"
picocodex = { version = "0.3.0", path = "crates/picocodex" }
picocodex-agent = { version = "0.3.0", path = "crates/picocodex-agent" }
picocodex-oai-api = { version = "0.3.0", path = "crates/picocodex-oai-api" }
picocodex-tools = { version = "0.3.0", path = "crates/picocodex-tools" }
picocodex-tools-macros = { version = "0.3.0", path = "crates/picocodex-tools/macros" }
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "webp"] }
iana-time-zone = "0.1.64"
js-sys = "0.3.82"
nix = { version = "0.31.3", default-features = false, features = ["process", "resource", "signal", "user"] }
portable-pty = "0.9.0"
proc-macro-crate = "3"
proc-macro2 = "1.0.106"
quote = "1.0.46"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rquickjs = "0.12.1"
rmcp = { version = "1.8.0", default-features = false, features = ["auth", "client", "reqwest-tls-no-provider", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
oauth2 = { version = "5.0", default-features = false }
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.0", default-features = false }
simd-json = "=0.15.1"
smallvec = { version = "1.15.1", features = ["serde"] }
sonic-rs = "0.5.8"
syn = { version = "2.0.119", features = ["full"] }
thiserror = "2.0.17"
tempfile = "3.27.0"
tokio = "1.48.0"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tower = { version = "0.5.2", features = ["limit", "load-shed", "retry", "timeout", "util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1", features = ["js", "serde", "v5", "v7"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-time = "1.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"

# Retain useful backtraces and source locations without emitting full
# local-variable debug information.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

# Opt-in builds can favor maximum runtime performance over build time without
# raising the minimum CPU level of binaries.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Optimized enough for representative CPU profiles while retaining full symbols.
[profile.profiling]
inherits = "release"
debug = "full"
strip = false

# Keep benchmark symbols so Criterion regressions can be profiled directly.
[profile.bench]
inherits = "profiling"

[profile.wasm]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "debuginfo"
